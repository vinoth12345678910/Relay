name: ui
on:
  push:
    paths:
      - 'relay-ui/**'
      - '.github/workflows/ui.yml'
      # The UI's contract test reads the backend DTOs: a DTO change must re-run it.
      - 'relay-server/src/main/java/**'
  pull_request:
    paths:
      - 'relay-ui/**'
      - '.github/workflows/ui.yml'
      - 'relay-server/src/main/java/**'

defaults:
  run:
    working-directory: relay-ui

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: relay-ui/package-lock.json
      # npm 10 (bundled with Node 20) crashes resolving Vitest 4's peer set; package.json pins npm 11.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: relay-ui/package-lock.json
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            relay-ui/playwright-report
            relay-ui/test-results
