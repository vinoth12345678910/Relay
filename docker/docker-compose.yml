name: relay
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - relay-pg:/var/lib/postgresql/data     # named volume: data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 20

  mock-receiver:
    build: { context: .., dockerfile: mock-receiver/Dockerfile }
    ports: ["9000:9000"]

  relay-server:
    build: { context: .., dockerfile: relay-server/Dockerfile }
    env_file: relay.dev.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: relay
      DB_USER: relay
      DB_PASSWORD: relay
    depends_on:
      postgres: { condition: service_healthy }   # healthy, not just started
    ports: ["8080:8080"]

volumes:
  relay-pg:
