# Default config (shared across all profiles)
spring:
  application:
    name: relay-server
  # Lets the delivery poller finish in-flight sends (relay.worker.shutdown-timeout-seconds, default 30)
  lifecycle:
    timeout-per-shutdown-phase: 45s
  # Use SPRING_PROFILES_ACTIVE=prod in production
  profiles:
    default: dev

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate  # DO NOT CREATE, let Flyway manage schema
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.format_sql: true

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:relay}
    username: ${DB_USER:relay}
    password: ${DB_PASSWORD:relay}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Server config
server:
  port: ${SERVER_PORT:8080}

# Actuator (health, metrics, etc.)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Logging
logging:
  level:
    root: INFO
    com.relay: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

# Relay (RELAY_ADMIN_TOKEN and RELAY_SECRET_ENCRYPTION_KEY are required; dev values live in application-dev.yaml)
relay:
  admin-token: ${RELAY_ADMIN_TOKEN:}
  secret-encryption-key: ${RELAY_SECRET_ENCRYPTION_KEY:}
  retry-after-max-seconds: ${RELAY_RETRY_AFTER_MAX_SECONDS:3600}

  per-endpoint-max-concurrency: ${RELAY_PER_ENDPOINT_MAX_CONCURRENCY:4}
