# Template: ${RELAY_API_UPSTREAM} is substituted at container start (nginx official image).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Same-origin API: the browser only ever talks to this server.
    location /api/ {
        proxy_pass ${RELAY_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never log the Authorization header (nginx's default log format does not include it).
        client_max_body_size 1m;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # SPA: every other path serves index.html, never cached.
    location / {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri /index.html;
    }
}
